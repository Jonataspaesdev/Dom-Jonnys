    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dom Jonnys - Painel Administrativo</title>
        <style>
            body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background-color: #f4f4f9; }
            h2 { color: #111; border-bottom: 2px solid #111; padding-bottom: 10px; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
            th { background-color: #111; color: #fff; }
            tr:hover { background-color: #f1f1f1; }
            .btn-refresh { background-color: #111; color: #fff; padding: 10px 15px; border: none; cursor: pointer; margin-bottom: 15px; }
            .btn-refresh:hover { background-color: #333; }
            .status-pendente { color: #d97706; font-weight: bold; }
            .btn-confirmar { background-color: #16a34a; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; margin-right: 5px; }
    .btn-cancelar { background-color: #dc2626; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    .status-confirmado { color: #16a34a; font-weight: bold; }
        </style>
    </head>
    <body>

        <h2>Painel do Barbeiro - Agendamentos</h2>
        
        <button class="btn-refresh" onclick="carregarAgendamentos()">Atualizar Lista</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente / Contato</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Status</th>
                    <th>Ações</th> <!-- Nova Coluna -->
                </tr>
            </thead>
            <tbody id="tabelaAgendamentos">
                <!-- Os dados serão inseridos dinamicamente aqui pelo JavaScript -->
            </tbody>
        </table>

        <script src="js/admin.js"></script>
    </body>
    </html>
