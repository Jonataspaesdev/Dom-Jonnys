<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Jonnys - Agendamento</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background-color: #111; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #333; }
        #mensagem { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Agendar Horário - Dom Jonnys</h2>
    <form id="formAgendamento">
        <div class="form-group">
            <label for="clienteInfo">Seu Nome / Telefone:</label>
            <input type="text" id="clienteInfo" required placeholder="Ex: João - (11) 99999-9999">
        </div>

        <div class="form-group">
            <label for="servico">Serviço:</label>
            <select id="servico" required>
                <option value="Corte de Cabelo">Corte de Cabelo</option>
                <option value="Barba">Barba</option>
                <option value="Corte + Barba">Combo Corte + Barba</option>
            </select>
        </div>

        <div class="form-group">
            <label for="data">Data:</label>
            <input type="date" id="data" required>
        </div>

        <div class="form-group">
            <label for="horario">Horário:</label>
            <input type="time" id="horario" required>
        </div>

        <button type="submit">Confirmar Agendamento</button>
    </form>

    <div id="mensagem"></div>

    <script src="./js/agendamento.js"></script>
</body>
</html>
