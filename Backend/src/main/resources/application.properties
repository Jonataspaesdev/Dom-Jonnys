# Nome da Aplicação
spring.application.name=DomJonnys

# Configuração do Banco de Dados H2 (Em Memória)
spring.datasource.url=jdbc:h2:mem:domjonnysdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do Hibernate / JPA (Criação automática das tabelas)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ativar o Console Visual do H2 no Navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Porta onde o servidor Java vai rodar (padrão 8080)
server.port=8080


# Desativa o bloqueio automático do Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration